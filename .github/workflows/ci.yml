name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install Pandoc
      run: sudo apt-get update && sudo apt-get install --yes pandoc
    - name: Install just
      uses: extractions/setup-just@v3
      with:
        just-version: 1.41.0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --locked
    - name: Run checks
      run: |
        just checks
    - name: Initialise coverage data
      run: |
        uv run coverage erase
    - name: Run unit contract gate
      run: |
        uv run pytest tests/unit --cov=src --cov-append --junitxml=test-results-unit.xml -s -v
    - name: Run integration gate
      run: |
        uv run pytest tests/integration --cov=src --cov-append --junitxml=test-results-integration.xml -s -v
    - name: Run behavioural parity gate
      run: |
        uv run pytest tests/behavioural_parity --cov=src --cov-append --junitxml=test-results-parity.xml -s -v
    - name: Build documentation examples
      run: |
        just docs
    - name: Download assets
      run: |
        just test-assets
    - name: Run coverage gate
      run: |
        uv run coverage report --show-missing --fail-under=50
        uv run coverage xml -o coverage.xml
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true
    - name: Upload test results to Codecov
      if: ${{ matrix.python-version == '3.11' && !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: test-results-*.xml
        fail_ci_if_error: true
