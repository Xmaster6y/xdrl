[project]
name = "xdrl"
version = "0.2.0"
description = "A small integration layer for TorchRL modules and TDHook workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yoann Poupart", email = "yoann.poupart@ens-lyon.org"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "tdhook @ git+https://github.com/Xmaster6y/tdhook@bb85c69b0d678205d5e534dfe6253fdf0a820eff",
    "tensordict>=0.13,<0.14",
    "torch>=2.11",
    "torchrl>=0.13,<0.14",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage = "https://xdrl.readthedocs.io/"
documentation = "https://xdrl.readthedocs.io/"
source = "https://github.com/Xmaster6y/xdrl"
issues = "https://github.com/Xmaster6y/xdrl/issues"
releasenotes = "https://github.com/Xmaster6y/xdrl/releases"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
docs = [
    "ipykernel>=6.29.5",
    "networkx>=3.4",
    "nbsphinx>=0.9.6",
    "pandoc>=2.4",
    "plotly>=5.24.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.0",
    "sphinx-charts>=0.2.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-bibtex>=2.6.5",
]

[build]
target-dir = "build/dist"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.sources]
tdhook = { git = "https://github.com/Xmaster6y/tdhook", branch = "main" }
tensordict = { git = "https://github.com/pytorch/tensordict" }
# TorchRL main currently selects nightly CPU wheels on macOS Python 3.11/3.13;
# mirror that upstream split until its source policy is unified.
torch = [
    { index = "pypi", marker = "sys_platform != 'darwin' or python_version == '3.12'" },
    { index = "pytorch-nightly", marker = "sys_platform == 'darwin' and python_version != '3.12'" },
]
torchrl = { git = "https://github.com/pytorch/rl", branch = "main" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests spanning xdrl, TorchRL, TensorDict, and TDHook boundaries",
    "behavioural_parity: deterministic comparison of instrumented and native execution",
]
