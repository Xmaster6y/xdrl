version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - python -m pip install --upgrade uv
    - uv pip install --system cmake
    - uv sync --locked
    - cd docs && uv run --group docs make html
    - mkdir -p $READTHEDOCS_OUTPUT
    - mv docs/build/html $READTHEDOCS_OUTPUT

sphinx:
  configuration: docs/source/conf.py
