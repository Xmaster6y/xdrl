defaults:
  - env@training_env: transformed_env
  - env@training_env.base_env: vmas
  - transform@training_env.transform: reward_sum
  - transform@postproc_done: expand_as
  - transform@postproc_terminated: expand_as
  - transform@collector_postproc: compose
  - env@eval_env: transformed_env
  - env@eval_env.base_env: vmas
  - transform@eval_env.transform: reward_sum
  - collector@collector: sync
  - replay_buffer@replay_buffer: base
  - storage@replay_buffer.storage: lazy_tensor
  - writer@replay_buffer.writer: round_robin
  - sampler@replay_buffer.sampler: random
  - trainer@trainer: dqn
  - optimizer@optimizer: adam
  - network@networks.mixer_network: qmixer
  - loss@mixer_loss: mixer
  - target_net_updater@target_net_updater: soft
  - logger@logger: wandb
  - xdrl_hook@logging_hooks: logging
  - xdrl_hook@validation_hook: validation_reward
  - xdrl_hook@wandb_finish_hook: wandb_finish
  - _self_

seed: 0

env:
  scenario_name: balance
  n_agents: 3
  n_actions: 9
  observation_dim: 16
  max_steps: 100
  train_envs: 60
  eval_envs: 200

model:
  group: agents
  hidden_dim: 256
  depth: 2
  share_policy_params: true
  mixing_embed_dim: 32

collector:
  create_env_fn: ${training_env}
  policy: ${models.qvalue_model}
  frames_per_batch: 6000
  total_frames: 12000000
  device: ${train.device}
  storing_device: ${train.storing_device}
  postproc: ${collector_postproc}
  no_cuda_sync: false
  init_random_frames: ${buffer.init_random_frames}
  _partial_: true

buffer:
  memory_size: 1000000
  init_random_frames: 0

loss:
  gamma: 0.9
  loss_function: l2
  delay_value: true
  tau: 0.005

exploration:
  eps_init: 0.8
  eps_end: 0.01
  anneal_frames: 1000000

train:
  device: cpu
  storing_device: cpu
  frame_skip: 1
  minibatch_size: 128
  optim_steps_per_batch: 1000
  max_grad_norm: 5.0
  progress_bar: true
  save_trainer_interval: 25000
  log_interval: 60000
  lr: 5e-5

eval:
  enabled: true
  pre_eval: true
  interval_frames: 120000
  max_steps: 100
  render: true
  video_fps: 20

networks:
  qvalue_network:
    _target_: torchrl.modules.models.multiagent.MultiAgentMLP
    n_agent_inputs: ${env.observation_dim}
    n_agent_outputs: ${env.n_actions}
    n_agents: ${env.n_agents}
    centralized: false
    share_params: ${model.share_policy_params}
    device: ${train.device}
    depth: ${model.depth}
    num_cells: ${model.hidden_dim}
    activation_class:
      _target_: torch.nn.Tanh
      _partial_: true
  mixer_network:
    state_shape:
      - ${env.n_agents}
      - ${env.observation_dim}
    mixing_embed_dim: ${model.mixing_embed_dim}
    n_agents: ${env.n_agents}
    device: ${train.device}

models:
  qvalue_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_qvalue_model
    network: ${networks.qvalue_network}
    action_space: categorical
    in_keys:
      - [agents, observation]
    action_key: [agents, action]
    action_value_key: [agents, action_value]
    chosen_action_value_key: [agents, chosen_action_value]
  mixer_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_tensordict_module
    module: ${networks.mixer_network}
    in_keys:
      - [agents, chosen_action_value]
      - [agents, observation]
    out_keys:
      - chosen_action_value

training_env:
  base_env:
    scenario: ${env.scenario_name}
    num_envs: ${env.train_envs}
    continuous_actions: false
    max_steps: ${env.max_steps}
    device: ${train.device}
    seed: ${seed}
    scenario_kwargs:
      n_agents: ${env.n_agents}
  transform:
    in_keys:
      - [agents, reward]
    out_keys:
      - [agents, episode_reward]

postproc_done:
  in_key: [next, done]
  ref_key: [next, agents, reward]
  out_key: [next, agents, done]

postproc_terminated:
  in_key: [next, terminated]
  ref_key: [next, agents, reward]
  out_key: [next, agents, terminated]

collector_postproc:
  transforms:
    - ${postproc_done}
    - ${postproc_terminated}

eval_env:
  base_env:
    scenario: ${env.scenario_name}
    num_envs: ${env.eval_envs}
    continuous_actions: false
    max_steps: ${eval.max_steps}
    device: ${train.device}
    seed: ${seed}
    scenario_kwargs:
      n_agents: ${env.n_agents}
  transform:
    in_keys:
      - [agents, reward]
    out_keys:
      - [agents, episode_reward]

replay_buffer:
  storage:
    max_size: ${buffer.memory_size}
    device: ${train.storing_device}
    ndim: 1
  writer:
    compilable: false
  batch_size: ${train.minibatch_size}

mixer_loss:
  local_value_network: ${models.qvalue_model}
  mixer_network: ${models.mixer_model}
  loss_function: ${loss.loss_function}
  delay_value: ${loss.delay_value}
  action_space: categorical
  gamma: ${loss.gamma}
  reward_key: reward
  done_key: done
  terminated_key: terminated
  action_key: [agents, action]
  action_value_key: [agents, action_value]
  local_value_key: [agents, chosen_action_value]
  global_value_key: chosen_action_value

target_net_updater:
  tau: ${loss.tau}

optimizer:
  lr: ${train.lr}

logger:
  exp_name: vmas_qmix_${env.scenario_name}
  project: xdrl
  log_dir: logs

validation_hook:
  enabled: ${eval.enabled}
  pre_eval: ${eval.pre_eval}
  policy_path: loss_module.local_value_network
  environment: ${eval_env}
  interval_frames: ${eval.interval_frames}
  frames_per_batch: ${collector.frames_per_batch}
  record_frames: ${eval.max_steps}
  exploration_type: DETERMINISTIC
  log_keys:
    - [next, agents, reward]
  log_pbar: false

logging_hooks:
  group: ${model.group}
  frame_skip: ${train.frame_skip}
  reward_key: [next, agents, reward]
  done_key: [next, done]
  episode_reward_key: [next, agents, episode_reward]

wandb_finish_hook:
  enabled: true

trainer:
  collector: ${collector}
  optimizer: ${optimizer}
  replay_buffer: ${replay_buffer}
  target_net_updater: ${target_net_updater}
  loss_module: ${mixer_loss}
  value_network: ${models.qvalue_model}
  logger: ${logger}
  total_frames: ${collector.total_frames}
  frame_skip: ${train.frame_skip}
  clip_grad_norm: true
  clip_norm: ${train.max_grad_norm}
  progress_bar: ${train.progress_bar}
  seed: ${seed}
  save_trainer_interval: ${train.save_trainer_interval}
  log_interval: ${train.log_interval}
  save_trainer_file: null
  optim_steps_per_batch: ${train.optim_steps_per_batch}
  eps_init: ${exploration.eps_init}
  eps_end: ${exploration.eps_end}
  annealing_num_steps: ${exploration.anneal_frames}
  mixing_strategy: qmix
  reward_key: reward
  episode_reward_key: episode_reward
  done_key: done
  terminated_key: terminated
  action_key: [agents, action]
  observation_key: [agents, observation]
  async_collection: false
  hooks:
    - ${logging_hooks}
    - ${validation_hook}
    - ${wandb_finish_hook}
