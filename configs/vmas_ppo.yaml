defaults:
  - env@training_env: transformed_env
  - env@training_env.base_env: vmas
  - transform@training_env.transform: reward_sum
  - transform@postproc_done: expand_as
  - transform@postproc_terminated: expand_as
  - transform@collector_postproc: compose
  - env@eval_env: transformed_env
  - env@eval_env.base_env: vmas
  - transform@eval_env.transform: reward_sum
  - collector@collector: sync
  - replay_buffer@replay_buffer: base
  - storage@replay_buffer.storage: lazy_tensor
  - writer@replay_buffer.writer: round_robin
  - sampler@replay_buffer.sampler: without_replacement
  - trainer@trainer: ppo
  - optimizer@optimizer: adam
  - loss@loss: ppo
  - logger@logger: wandb
  - xdrl_hook@logging_hooks: logging
  - xdrl_hook@validation_hook: validation_reward
  - xdrl_hook@policy_checkpoint_hook: policy_checkpoint
  - xdrl_hook@wandb_finish_hook: wandb_finish
  - _self_

algo: mappo
seed: 0

env:
  scenario_name: balance
  n_agents: 3
  max_steps: 100
  train_envs: 600
  eval_envs: 200

model:
  shared_parameters: false
  centralized_critic: true

train:
  device: cpu
  num_epochs: 1
  minibatch_size: 4096
  lr: 5e-5
  max_grad_norm: 5.0
  optim_steps_per_batch: 45
  total_frames: 12000000
  save_trainer_interval: 25000
  log_interval: 60000
  policy_checkpoint_interval: 0
  policy_checkpoint_dir: checkpoints/policy
  policy_checkpoint_prefix: policy

eval:
  enabled: true
  pre_eval: true
  interval_frames: 120000
  max_steps: 100
  deterministic: true
  non_deterministic: true
  render: true
  video_fps: 20

networks:
  policy_network:
    _target_: torchrl.modules.models.multiagent.MultiAgentMLP
    n_agent_inputs: 16
    n_agent_outputs: 4
    n_agents: ${env.n_agents}
    centralized: false
    share_params: ${model.shared_parameters}
    device: ${train.device}
    depth: 2
    num_cells: 256
    activation_class:
      _target_: torch.nn.Tanh
      _partial_: true
  value_network:
    _target_: torchrl.modules.models.multiagent.MultiAgentMLP
    n_agent_inputs: 16
    n_agent_outputs: 1
    n_agents: ${env.n_agents}
    centralized: ${model.centralized_critic}
    share_params: ${model.shared_parameters}
    device: ${train.device}
    depth: 2
    num_cells: 256
    activation_class:
      _target_: torch.nn.Tanh
      _partial_: true

models:
  policy_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_tanh_normal_model
    network: ${networks.policy_network}
    return_log_prob: true
    in_keys:
      - [agents, observation]
    param_keys:
      - [agents, loc]
      - [agents, scale]
    out_keys:
      - [agents, action]
  value_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_value_model
    network: ${networks.value_network}
    in_keys:
      - [agents, observation]

training_env:
  base_env:
    scenario: ${env.scenario_name}
    num_envs: ${env.train_envs}
    continuous_actions: true
    max_steps: ${env.max_steps}
    device: ${train.device}
    seed: ${seed}
    scenario_kwargs:
      n_agents: ${env.n_agents}
  transform:
    in_keys:
      - [agents, reward]
    out_keys:
      - [agents, episode_reward]

postproc_done:
  in_key: [next, done]
  ref_key: [next, agents, reward]
  out_key: [next, agents, done]

postproc_terminated:
  in_key: [next, terminated]
  ref_key: [next, agents, reward]
  out_key: [next, agents, terminated]

collector_postproc:
  transforms:
    - ${postproc_done}
    - ${postproc_terminated}

collector:
  create_env_fn: ${training_env}
  policy: ${models.policy_model}
  frames_per_batch: 60000
  total_frames: ${train.total_frames}
  policy_device: ${train.device}
  env_device: ${train.device}
  storing_device: ${train.device}
  postproc: ${collector_postproc}
  no_cuda_sync: false
  _partial_: true

replay_buffer:
  storage:
    max_size: ${collector.frames_per_batch}
    device: ${train.device}
    ndim: 1
  batch_size: ${train.minibatch_size}

loss:
  actor_network: ${models.policy_model}
  critic_network: ${models.value_model}
  loss_type: clip
  entropy_coeff: 0.001
  normalize_advantage: false

optimizer:
  lr: ${train.lr}

logger:
  exp_name: vmas_ppo_${env.scenario_name}
  project: xdrl
  log_dir: logs

eval_env:
  base_env:
    scenario: ${env.scenario_name}
    num_envs: ${env.eval_envs}
    continuous_actions: true
    max_steps: ${eval.max_steps}
    device: ${train.device}
    seed: ${seed}
    scenario_kwargs:
      n_agents: ${env.n_agents}
  transform:
    in_keys:
      - [agents, reward]
    out_keys:
      - [agents, episode_reward]

validation_hook:
  enabled: ${eval.enabled}
  pre_eval: ${eval.pre_eval}
  policy_path: loss_module.actor_network
  environment: ${eval_env}
  interval_frames: ${eval.interval_frames}
  frames_per_batch: ${collector.frames_per_batch}
  record_frames: ${eval.max_steps}
  exploration_type: DETERMINISTIC
  log_keys:
    - [next, agents, reward]
  log_pbar: false

logging_hooks:
  group: agents
  reward_key: [next, agents, reward]
  done_key: [next, done]
  episode_reward_key: [next, agents, episode_reward]

policy_checkpoint_hook:
  policy_path: loss_module.actor_network
  directory: ${train.policy_checkpoint_dir}
  interval: ${train.policy_checkpoint_interval}
  prefix: ${train.policy_checkpoint_prefix}
  destination: post_steps
  meta:
    algo: ${algo}
    group: agents

wandb_finish_hook:
  enabled: true

trainer:
  collector: ${collector}
  optimizer: ${optimizer}
  replay_buffer: ${replay_buffer}
  loss_module: ${loss}
  logger: ${logger}
  total_frames: ${collector.total_frames}
  frame_skip: 1
  clip_grad_norm: true
  clip_norm: ${train.max_grad_norm}
  progress_bar: true
  seed: ${seed}
  save_trainer_interval: ${train.save_trainer_interval}
  log_interval: ${train.log_interval}
  save_trainer_file: null
  optim_steps_per_batch: ${train.optim_steps_per_batch}
  num_epochs: ${train.num_epochs}
  actor_network: ${models.policy_model}
  critic_network: ${models.value_model}
  add_gae: true
  gae: null
  reward_key: [agents, reward]
  episode_reward_key: [agents, episode_reward]
  done_key: [agents, done]
  terminated_key: [agents, terminated]
  action_key: [agents, action]
  observation_key: [agents, observation]
  async_collection: false
  hooks:
    - ${logging_hooks}
    - ${validation_hook}
    - ${policy_checkpoint_hook}
    - ${wandb_finish_hook}
