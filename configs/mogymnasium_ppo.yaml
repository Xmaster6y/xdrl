defaults:
  - env@training_env: transformed_env
  - env@training_env.base_env: mo_gym
  - transform@training_scalarize_reward: linearise_rewards
  - transform@training_episode_reward: reward_sum
  - transform@training_env.transform: compose
  - env@eval_env: transformed_env
  - env@eval_env.base_env: mo_gym
  - transform@eval_scalarize_reward: linearise_rewards
  - transform@eval_episode_reward: reward_sum
  - transform@eval_env.transform: compose
  - collector@collector: sync
  - replay_buffer@replay_buffer: base
  - storage@replay_buffer.storage: lazy_tensor
  - writer@replay_buffer.writer: round_robin
  - sampler@replay_buffer.sampler: without_replacement
  - trainer@trainer: ppo
  - optimizer@optimizer: adam
  - loss@loss_module: ppo
  - logger@logger: wandb
  - xdrl_hook@gae_hook: gae
  - xdrl_hook@logging_hooks: logging
  - xdrl_hook@validation_hook: validation_reward
  - xdrl_hook@wandb_flush_hook: wandb_flush
  - xdrl_hook@wandb_finish_hook: wandb_finish
  - _self_

seed: 0

env:
  id: mo-mountaincarcontinuous-v0
  observation_dim: 2
  action_dim: 1
  train_envs: 8
  eval_envs: 32

model:
  hidden_dim: 256
  depth: 2

scalarization:
  weights: null

collector:
  create_env_fn: ${training_env}
  policy: ${models.policy_model}
  frames_per_batch: 2000
  total_frames: 1000000
  device: ${train.device}
  storing_device: ${train.storing_device}
  no_cuda_sync: false
  _partial_: true

loss:
  gamma: 0.99
  lmbda: 0.95
  entropy_coeff: 0.0

train:
  device: cpu
  storing_device: cpu
  frame_skip: 1
  num_epochs: 10
  minibatch_size: 256
  optim_steps_per_batch: 8
  progress_bar: true
  save_trainer_interval: 25000
  log_interval: 10000
  lr: 0.0003
  max_grad_norm: 1.0

eval:
  enabled: true
  pre_eval: true
  interval_frames: 20000
  max_steps: 1000
  render_mode: rgb_array
  video_fps: 20

networks:
  policy_network:
    _target_: torchrl.modules.MLP
    in_features: ${env.observation_dim}
    out_features: 2
    depth: ${model.depth}
    num_cells: ${model.hidden_dim}
    activation_class:
      _target_: torch.nn.Tanh
      _partial_: true
    device: ${train.device}
  value_network:
    _target_: torchrl.modules.MLP
    in_features: ${env.observation_dim}
    out_features: 1
    depth: ${model.depth}
    num_cells: ${model.hidden_dim}
    activation_class:
      _target_: torch.nn.Tanh
      _partial_: true
    device: ${train.device}

models:
  policy_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_tanh_normal_model
    network: ${networks.policy_network}
    in_keys:
      - observation
    param_keys:
      - loc
      - scale
    out_keys:
      - action
    return_log_prob: true
  value_model:
    _target_: torchrl.trainers.algorithms.configs.modules._make_value_model
    network: ${networks.value_network}
    in_keys:
      - observation

training_env:
  base_env:
    env_name: ${env.id}
    num_envs: ${env.train_envs}
    device: ${train.device}
  transform:
    transforms:
      - ${training_scalarize_reward}
      - ${training_episode_reward}

training_scalarize_reward:
  in_keys:
    - reward
  out_keys:
    - reward
  weights: ${scalarization.weights}

training_episode_reward:
  in_keys:
    - reward
  out_keys:
    - episode_reward

eval_env:
  base_env:
    env_name: ${env.id}
    num_envs: ${env.eval_envs}
    device: ${train.device}
    render_mode: ${eval.render_mode}
  transform:
    transforms:
      - ${eval_scalarize_reward}
      - ${eval_episode_reward}

eval_scalarize_reward:
  in_keys:
    - reward
  out_keys:
    - reward
  weights: ${scalarization.weights}

eval_episode_reward:
  in_keys:
    - reward
  out_keys:
    - episode_reward

replay_buffer:
  storage:
    max_size: ${collector.frames_per_batch}
    device: ${train.storing_device}
    ndim: 1
  batch_size: ${train.minibatch_size}

loss_module:
  actor_network: ${models.policy_model}
  critic_network: ${models.value_model}
  loss_type: clip
  entropy_coeff: ${loss.entropy_coeff}
  normalize_advantage: false
  gamma: ${loss.gamma}

optimizer:
  lr: ${train.lr}

logger:
  exp_name: mogymnasium_ppo_${env.id}
  project: xdrl
  log_dir: logs

validation_hook:
  enabled: ${eval.enabled}
  pre_eval: ${eval.pre_eval}
  policy_path: loss_module.actor_network
  environment: ${eval_env}
  interval_frames: ${eval.interval_frames}
  frames_per_batch: ${collector.frames_per_batch}
  record_frames: ${eval.max_steps}
  exploration_type: DETERMINISTIC
  log_keys:
    - [next, reward]
  log_pbar: false

gae_hook:
  gamma: ${loss.gamma}
  lmbda: ${loss.lmbda}
  value_network_path: loss_module.critic_network
  reward_key: reward
  done_key: done
  terminated_key: terminated
  value_key: state_value

logging_hooks:
  group: agent
  frame_skip: ${train.frame_skip}
  reward_key: [next, reward]
  done_key: [next, done]
  episode_reward_key: [next, episode_reward]
  episode_reward_weights: ${scalarization.weights}

wandb_finish_hook:
  enabled: true

wandb_flush_hook:
  enabled: true

trainer:
  collector: ${collector}
  optimizer: ${optimizer}
  replay_buffer: ${replay_buffer}
  loss_module: ${loss_module}
  logger: ${logger}
  total_frames: ${collector.total_frames}
  frame_skip: ${train.frame_skip}
  clip_grad_norm: true
  clip_norm: ${train.max_grad_norm}
  progress_bar: ${train.progress_bar}
  seed: ${seed}
  save_trainer_interval: ${train.save_trainer_interval}
  log_interval: ${train.log_interval}
  save_trainer_file: null
  enable_logging: false
  auto_log_optim_steps: false
  optim_steps_per_batch: ${train.optim_steps_per_batch}
  num_epochs: ${train.num_epochs}
  actor_network: ${models.policy_model}
  critic_network: ${models.value_model}
  add_gae: false
  gae: null
  reward_key: reward
  episode_reward_key: episode_reward
  done_key: done
  terminated_key: terminated
  action_key: action
  observation_key: observation
  async_collection: false
  hooks:
    - ${gae_hook}
    - ${logging_hooks}
    - ${validation_hook}
    - ${wandb_flush_hook}
    - ${wandb_finish_hook}
